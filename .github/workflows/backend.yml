name: Backend checks
on:
  push:
    branches: [master, zhangzhengyuan-dev]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CAD_DB/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          python-version: "3.11"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest -q -m "not integration"
