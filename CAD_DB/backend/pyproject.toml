[project]
name = "cad-db-backend"
version = "0.1.0"
description = "CAD DB FastAPI backend service"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "httpx==0.28.1",
    "neo4j>=5.20.0",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

markers = ["integration: requires running FastAPI and storage services"]
